<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6447d8">
  <meta name="referrer" content="no-referrer">
  <title>Reset password | NexLiga</title>
  <link rel="stylesheet" href="/app.css">
  <script>const savedTheme=localStorage.getItem('fairdraft-theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;</script>
</head>
<body>
  <header class="site">
    <a class="logo" href="/index.html" aria-label="NexLiga home"><svg class="logo-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M12 7l3 2.2-1.1 3.6h-3.8L9 9.2 12 7z" fill="currentColor"/><path d="M12 4.4V7M4.4 12H7M17 12h2.6M12 17v2.6M7.2 7.2l1.6 1.6M15.2 8.8l1.6-1.6M7.2 16.8l1.6-1.6M15.2 15.2l1.6 1.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span class="logo-word">NexLiga</span></a>
  </header>
  <main class="reset-page">
    <section class="reset-card" aria-labelledby="resetTitle">
      <span class="eyebrow">Account recovery</span>
      <h1 id="resetTitle">Choose a new password</h1>
      <p>Use at least 10 characters. Your other sessions will be signed out after the password changes.</p>
      <form id="resetForm">
        <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="200" required></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="200" required></div>
        <div class="reset-message" id="resetMessage" role="status"></div>
        <button class="btn-primary" type="submit">Update password</button>
      </form>
      <p style="margin:18px 0 0"><a href="/index.html">Return to NexLiga</a></p>
    </section>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
